name: Default Credential Probe

on:
  pull_request:
    branches:
      - main

jobs:
  probe-default-credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether historical seeded credential still authenticates
        shell: bash
        run: |
          set -euo pipefail
          base="https://vineyard-sms-gq1q.onrender.com"
          password="$(sed -n 's/.*password: "\([^"]*\)".*/\1/p' packages/web/seed.ts | head -1)"
          if [[ -z "$password" ]]; then
            echo "Could not recover historical seed credential from this temporary probe branch"
            exit 2
          fi

          vulnerable=0
          for email in admin@vineyard.school principal@vineyard.school teacher@vineyard.school accountant@vineyard.school; do
            payload="$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,rememberMe:false}')"
            status="$(curl -sS --max-time 30 -o /tmp/signin.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST "$base/api/auth/sign-in/email" \
              --data "$payload" || true)"

            if [[ "$status" == "200" ]]; then
              echo "VULNERABLE: historical shared credential still works for $email"
              vulnerable=1
            else
              echo "OK: historical shared credential rejected for $email (HTTP $status)"
            fi
          done

          if [[ "$vulnerable" == "1" ]]; then
            echo "At least one production account still accepts the publicly committed historical password."
            exit 1
          fi

          echo "Historical shared credential is rejected for all seeded role accounts."
