name: Production Role Access Probe

on:
  pull_request:
    branches:
      - main

jobs:
  probe-role-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Principal and Teacher read-only role boundaries
        id: role_probe
        shell: bash
        run: |
          set -uo pipefail
          base="https://vineyard-sms-gq1q.onrender.com"
          historical_seed="https://raw.githubusercontent.com/nuru999/VINEYARD-SMS/10d6b7d29cf2bca33a99d421861b8b7251360bb2/packages/web/seed.ts"
          password="$(curl -fsSL "$historical_seed" | sed -n 's/.*password: "\([^"]*\)".*/\1/p' | head -1)"
          test -n "$password" || exit 2
          failures=0

          sign_in() {
            local role="$1" email="$2" jar="$3"
            local payload status
            payload="$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,rememberMe:false}')"
            status="$(curl -sS --max-time 30 -c "$jar" -o "/tmp/${role}-signin.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' -X POST "$base/api/auth/sign-in/email" --data "$payload" || true)"
            echo "$role sign-in => HTTP $status"
            [[ "$status" == "200" ]]
          }

          expect_get() {
            local role="$1" jar="$2" path="$3" expected="$4"
            local safe status body
            safe="$(echo "$path" | tr '/?=&' '_____')"
            status="$(curl -sS --max-time 30 -b "$jar" -o "/tmp/${role}-${safe}.json" -w '%{http_code}' "$base$path" || true)"
            body="$(cat "/tmp/${role}-${safe}.json" 2>/dev/null || true)"
            if [[ "$status" == "$expected" ]]; then
              echo "PASS: $role GET $path => $status"
            else
              message="$(printf '%s' "$body" | jq -r '.message // empty' 2>/dev/null || true)"
              echo "FAIL: $role GET $path => $status expected $expected${message:+; message=$message}"
              failures=$((failures + 1))
            fi
          }

          if sign_in principal principal@vineyard.school /tmp/principal.cookies; then
            expect_get principal /tmp/principal.cookies /api/dashboard/stats 200
            expect_get principal /tmp/principal.cookies /api/students 200
            expect_get principal /tmp/principal.cookies /api/staff 200
            expect_get principal /tmp/principal.cookies /api/fee-payments 200
            expect_get principal /tmp/principal.cookies /api/accounts 200
            expect_get principal /tmp/principal.cookies /api/settings 200
            expect_get principal /tmp/principal.cookies /api/me/users 403
          else
            failures=$((failures + 1))
          fi

          if sign_in teacher teacher@vineyard.school /tmp/teacher.cookies; then
            expect_get teacher /tmp/teacher.cookies /api/dashboard/stats 200
            expect_get teacher /tmp/teacher.cookies /api/students 200
            expect_get teacher /tmp/teacher.cookies /api/attendance 200
            expect_get teacher /tmp/teacher.cookies /api/exams 200
            expect_get teacher /tmp/teacher.cookies /api/timetable 200
            expect_get teacher /tmp/teacher.cookies /api/settings 200
            expect_get teacher /tmp/teacher.cookies /api/staff 403
            expect_get teacher /tmp/teacher.cookies /api/fee-payments 403
            expect_get teacher /tmp/teacher.cookies /api/accounts 403
            expect_get teacher /tmp/teacher.cookies /api/me/users 403
          else
            failures=$((failures + 1))
          fi

          echo "Role boundary failures: $failures"
          test "$failures" -eq 0

      - name: Re-check Accountant historical credential after cooldown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          base="https://vineyard-sms-gq1q.onrender.com"
          historical_seed="https://raw.githubusercontent.com/nuru999/VINEYARD-SMS/10d6b7d29cf2bca33a99d421861b8b7251360bb2/packages/web/seed.ts"
          password="$(curl -fsSL "$historical_seed" | sed -n 's/.*password: "\([^"]*\)".*/\1/p' | head -1)"
          payload="$(jq -nc --arg email 'accountant@vineyard.school' --arg password "$password" '{email:$email,password:$password,rememberMe:false}')"
          status="$(curl -sS --max-time 30 -o /tmp/accountant-signin.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -X POST "$base/api/auth/sign-in/email" --data "$payload" || true)"
          if [[ "$status" == "200" ]]; then
            echo "SECURITY BLOCKER: Accountant also accepts the historical shared credential"
            exit 1
          fi
          if [[ "$status" == "429" ]]; then
            echo "Accountant credential status remains inconclusive because production rate limiting is active"
            exit 2
          fi
          echo "PASS: Accountant historical credential rejected (HTTP $status)"
